<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vetica Workspace</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#222;font-size:14px}
.app{max-width:900px;margin:0 auto;padding:16px}
.header{display:flex;align-items:center;gap:8px;padding:16px 0 20px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:500;letter-spacing:-0.5px;color:#555}
.logo span{color:#999;font-weight:400}
.sync-bar{display:flex;align-items:center;gap:6px;font-size:12px;color:#666}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#888;flex-shrink:0}
.sync-dot.ok{background:#639922}.sync-dot.syncing{background:#BA7517}.sync-dot.err{background:#E24B4A}
.nav{display:flex;gap:4px;border-bottom:1px solid #e5e5e5;margin-bottom:20px}
.nav-btn{padding:8px 16px;border:none;background:none;cursor:pointer;color:#888;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.nav-btn.active{color:#222;border-bottom-color:#555;font-weight:500}
.tab{display:none}.tab.active{display:block}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-card{background:#f5f5f3;border-radius:8px;padding:12px 16px}
.stat-label{font-size:12px;color:#888;margin-bottom:4px}
.stat-num{font-size:22px;font-weight:500}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#222;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#555;box-shadow:0 0 0 2px rgba(85,85,85,0.1)}
.btn{padding:8px 16px;border:1px solid #ddd;border-radius:8px;background:transparent;color:#222;cursor:pointer;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f5f5f3}
.btn-primary{background:#555;color:#fff;border-color:#555}
.btn-primary:hover{background:#444}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{color:#E24B4A;border-color:#E24B4A}
.row-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.mb12{margin-bottom:12px}.mt12{margin-top:12px}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.todo-item:last-child{border-bottom:none}
.todo-check{width:22px;height:22px;border-radius:5px;border:2px solid #bbb;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff}
.todo-check:hover{border-color:#555}
.todo-check.done{background:#555;border-color:#555;color:#fff}
.todo-text{flex:1;font-size:14px;line-height:1.5}
.todo-text.done{text-decoration:line-through;color:#aaa}
.badge{font-size:11px;padding:2px 8px;border-radius:100px;font-weight:500}
.badge-high{background:#FAECE7;color:#993C1D}
.badge-mid{background:#FAEEDA;color:#854F0B}
.badge-low{background:#EAF3DE;color:#3B6D11}
.badge-member{background:#f5f5f3;color:#666}
.empty{text-align:center;padding:32px;color:#bbb;font-size:13px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:4px 12px;border-radius:100px;border:1px solid #ddd;background:transparent;cursor:pointer;font-size:12px;color:#888;font-family:inherit}
.filter-btn.active{background:#555;color:#fff;border-color:#555}
.inline-form{background:#f9f9f8;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #e5e5e5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.form-label{font-size:12px;color:#888;margin-bottom:4px;display:block}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-day-name{text-align:center;font-size:11px;color:#888;padding:4px;font-weight:500}
.cal-day{min-height:64px;padding:4px;border-radius:8px;border:1px solid transparent;cursor:pointer;overflow:hidden}
.cal-day:hover{background:#f5f5f3}
.cal-day.today{border-color:#555}
.cal-day.other-month .cal-num{color:#ccc}
.cal-num{font-size:12px;font-weight:500;margin-bottom:2px}
.cal-dot{font-size:10px;padding:1px 4px;border-radius:3px;background:#f0f0f0;color:#888;margin-bottom:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;max-width:100%}
.cal-dot.high{background:#FAECE7;color:#993C1D}
.cal-dot.mid{background:#FAEEDA;color:#854F0B}
.cal-dot.low{background:#EAF3DE;color:#3B6D11}
.goal-item{padding:14px;border:1px solid #e5e5e5;border-radius:10px;margin-bottom:10px}
.progress-bar{height:4px;background:#f0f0f0;border-radius:2px;margin:8px 0 10px}
.progress-fill{height:100%;background:#555;border-radius:2px}
.sub-row{display:flex;align-items:center;gap:4px;padding:4px 0;flex-wrap:nowrap}
.sub-check{border-radius:4px;border:1.5px solid #bbb;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff}
.sub-check.done{background:#555;border-color:#555;color:#fff}
.sub-form{display:none;background:#f5f5f3;border-radius:6px;border:1px dashed #ddd;padding:8px;margin:2px 0 4px}
.drag-over{border-top:3px solid #555 !important;background:#f0f0ee !important}
.drag-handle{cursor:grab;color:#bbb;padding:0 6px;flex-shrink:0;display:flex;align-items:center;user-select:none}
.drag-handle:hover{color:#555}
.drag-handle:active{cursor:grabbing}border-radius:6px;cursor:pointer;padding:2px 7px;font-size:11px;font-family:inherit;flex-shrink:0;border-width:1px;border-style:solid;display:inline-flex;align-items:center;gap:3px}
.pomo-ring{width:160px;height:160px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center}
.pomo-svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
.setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.user-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:100px;background:#f5f5f3;font-size:12px;font-weight:500}
</style>
</head>
<body>
<div class="app">

<!-- 全域錯誤 -->
<div id="global-err" style="display:none;background:#fff5f5;color:#993C1D;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;position:fixed;top:10px;left:10px;right:10px;z-index:999"></div>

<!-- 登入 -->
<div id="setup-screen" class="setup">
  <div class="card" style="width:340px;text-align:center;padding:32px">
    <div class="logo" style="margin-bottom:20px">vetica <span>workspace</span></div>
    <div style="margin-bottom:16px;text-align:left">
      <label class="form-label">工作區名稱 <span style="color:#E24B4A">*</span></label>
      <input id="ws-name" type="text" placeholder="例如：vetica-team" autocomplete="off">
      <div style="font-size:11px;color:#aaa;margin-top:4px">所有成員輸入相同名稱即可共享資料</div>
    </div>
    <div style="margin-bottom:20px;text-align:left">
      <label class="form-label">你的名稱 <span style="color:#E24B4A">*</span></label>
      <input id="user-name" type="text" placeholder="例如：Alex" autocomplete="off">
    </div>
    <button id="join-btn" class="btn btn-primary" style="width:100%;justify-content:center"><i class="ti ti-arrow-right"></i> 進入工作區</button>
    <div id="setup-err" style="color:#E24B4A;font-size:12px;margin-top:10px;display:none"></div>
  </div>
</div>

<!-- 主畫面 -->
<div id="main-app" style="display:none">
  <div class="header">
    <div class="logo">vetica <span>workspace</span></div>
    <div class="sync-bar"><div class="sync-dot" id="sync-dot"></div><span id="sync-lbl">連線中...</span></div>
    <div style="flex:1"></div>
    <div class="user-pill"><i class="ti ti-user" style="font-size:13px"></i><span id="cur-user"></span></div>
    <div class="stat-card" style="padding:6px 14px;display:inline-flex;gap:16px">
      <div><div class="stat-label">待辦</div><div style="font-size:16px;font-weight:500" id="h-todo">0</div></div>
      <div style="border-left:1px solid #e5e5e5;padding-left:16px"><div class="stat-label">今日</div><div style="font-size:16px;font-weight:500" id="h-today">0</div></div>
    </div>
    <button onclick="loadAll()" class="btn btn-sm" style="font-size:11px"><i class="ti ti-refresh"></i> 重新載入</button>
    <button onclick="toggleBackupPanel()" class="btn btn-sm" style="font-size:11px;color:#BA7517;border-color:#BA7517"><i class="ti ti-database"></i> 備份還原</button>
  </div>

  <div class="nav">
    <button class="nav-btn active" data-tab="todo"><i class="ti ti-check"></i> 待辦事項</button>
    <button class="nav-btn" data-tab="cal"><i class="ti ti-calendar"></i> 行事曆</button>
    <button class="nav-btn" data-tab="goal"><i class="ti ti-target"></i> 目標規劃</button>
    <button class="nav-btn" data-tab="timer"><i class="ti ti-clock"></i> 番茄鐘</button>
  </div>

  <!-- 備份面板 -->
  <div id="backup-panel" style="display:none" class="inline-form">
    <div class="row-between mb12">
      <div style="font-weight:500;font-size:15px"><i class="ti ti-database"></i> 備份與還原</div>
      <button onclick="toggleBackupPanel()" class="btn btn-sm"><i class="ti ti-x"></i></button>
    </div>
    <div class="grid2" style="margin-bottom:12px">
      <div class="stat-card"><div class="stat-label">目標數量</div><div class="stat-num" id="bk-goals">0</div></div>
      <div class="stat-card"><div class="stat-label">待辦數量</div><div class="stat-num" id="bk-todos">0</div></div>
    </div>
    <button onclick="exportJSON()" class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:10px"><i class="ti ti-download"></i> 匯出 JSON 備份檔</button>
    <div style="margin-bottom:8px;font-size:12px;color:#888">匯入備份（選擇之前匯出的 .json 檔）</div>
    <input type="file" id="import-file" accept=".json" style="margin-bottom:8px">
    <button onclick="importJSON()" class="btn" style="width:100%;justify-content:center;border-color:#BA7517;color:#BA7517;margin-bottom:8px"><i class="ti ti-upload"></i> 匯入 JSON 還原資料</button>
    <div id="import-status" style="display:none;font-size:13px;padding:8px 12px;border-radius:8px"></div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid #e5e5e5;font-size:12px;color:#aaa">
      <div id="bk-local-time" style="margin-bottom:6px"></div>
      <button onclick="restoreFromBackup()" class="btn btn-sm" style="font-size:12px">從本機快取還原</button>
    </div>
  </div>

  <!-- 待辦事項 -->
  <div class="tab active" id="tab-todo">
    <div id="conn-err" style="display:none;background:#fff5f5;color:#993C1D;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px"></div>
    <div id="todo-form" style="display:none" class="inline-form">
      <div style="font-weight:500;margin-bottom:10px" id="todo-form-title">新增任務</div>
      <input id="f-text" type="text" placeholder="任務名稱 *" style="margin-bottom:8px">
      <div class="form-grid">
        <div><label class="form-label">優先級</label>
          <select id="f-pri"><option value="">未設定</option><option value="high">🔴 高優先</option><option value="mid">🟡 中優先</option><option value="low">🟢 低優先</option></select></div>
        <div><label class="form-label">負責人</label><select id="f-member"></select></div>
      </div>
      <div style="margin-bottom:8px"><label class="form-label">計劃日期</label><input id="f-date" type="date"></div>
      <div style="margin-bottom:12px"><label class="form-label">備註</label><textarea id="f-note" rows="2" placeholder="備註（選填）"></textarea></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-sm" id="todo-cancel-btn">取消</button>
        <button class="btn btn-primary btn-sm" id="todo-save-btn"><i class="ti ti-check"></i> 儲存</button>
      </div>
    </div>
    <div class="row-between mb12">
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="active">進行中</button>
        <button class="filter-btn" data-filter="done">已完成</button>
        <button class="filter-btn" data-filter="high">🔴 高</button>
        <button class="filter-btn" data-filter="mid">🟡 中</button>
        <button class="filter-btn" data-filter="low">🟢 低</button>
        <button class="filter-btn" id="sort-done-btn" onclick="moveDoneToBottom()" style="border-color:#639922;color:#639922"><i class="ti ti-arrow-down" style="font-size:11px"></i> 整理</button>
      </div>
      <button class="btn btn-primary" id="todo-add-btn"><i class="ti ti-plus"></i> 新增任務</button>
    </div>
    <div class="card"><div id="todo-list"></div></div>
    <div class="grid2 mt12">
      <div class="stat-card"><div class="stat-label">待完成</div><div class="stat-num" id="s-active">0</div></div>
      <div class="stat-card"><div class="stat-label">已完成</div><div class="stat-num" id="s-done">0</div></div>
    </div>
  </div>

  <!-- 行事曆 -->
  <div class="tab" id="tab-cal">
    <div class="card">
      <div class="cal-header">
        <button class="btn btn-primary" style="padding:6px 14px" id="cal-prev"><i class="ti ti-chevron-left"></i> 上個月</button>
        <div style="text-align:center">
          <div id="cal-title" style="font-weight:500;font-size:15px"></div>
          <button class="btn btn-sm" id="cal-today-btn" style="font-size:11px;margin-top:4px">回到今月</button>
        </div>
        <button class="btn btn-primary" style="padding:6px 14px" id="cal-next">下個月 <i class="ti ti-chevron-right"></i></button>
      </div>
      <div id="cal-summary" style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"></div>
      <div class="cal-grid" id="cal-names"></div>
      <div class="cal-grid mt12" id="cal-days"></div>
    </div>
    <div class="card mt12" id="cal-detail" style="display:none"><div id="cal-detail-content"></div></div>
  </div>

  <!-- 目標規劃 -->
  <div class="tab" id="tab-goal">
    <div id="goal-form" style="display:none" class="inline-form">
      <div style="font-weight:500;margin-bottom:10px" id="goal-form-title">新增目標</div>
      <input id="f-gname" type="text" placeholder="目標名稱 *" style="margin-bottom:8px">
      <div style="margin-bottom:8px"><label class="form-label">截止日期</label><input id="f-gdate" type="date"></div>
      <div style="margin-bottom:12px">
        <label class="form-label">第一層子任務（每行一項）</label>
        <textarea id="f-gsub" rows="5" placeholder="子任務 1&#10;子任務 2" style="resize:vertical;min-height:100px"></textarea>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-sm" id="goal-cancel-btn">取消</button>
        <button class="btn btn-primary btn-sm" id="goal-save-btn"><i class="ti ti-check"></i> 儲存目標</button>
      </div>
    </div>
    <div class="row-between mb12">
      <span style="font-size:15px;font-weight:500">目標清單</span>
      <button class="btn btn-primary" id="goal-add-btn"><i class="ti ti-plus"></i> 新增目標</button>
    </div>
    <div id="goal-list"></div>
  </div>

  <!-- 番茄鐘 -->
  <div class="tab" id="tab-timer">
    <div class="card" style="text-align:center;padding:28px 16px">
      <div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px">
        <button class="filter-btn active" data-pomo="work">專注 25分</button>
        <button class="filter-btn" data-pomo="short">短休 5分</button>
        <button class="filter-btn" data-pomo="long">長休 15分</button>
      </div>
      <div class="pomo-ring">
        <svg class="pomo-svg" width="160" height="160" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="70" fill="none" stroke="#e5e5e5" stroke-width="6"/>
          <circle id="pomo-arc" cx="80" cy="80" r="70" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-dasharray="439.82" stroke-dashoffset="0"/>
        </svg>
        <div><div id="pomo-display" style="font-size:32px;font-weight:500">25:00</div><div id="pomo-status" style="font-size:12px;color:#888;margin-top:4px">專注時間</div></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn btn-primary" id="pomo-toggle"><i class="ti ti-player-play"></i> 開始</button>
        <button class="btn" id="pomo-reset"><i class="ti ti-refresh"></i> 重置</button>
      </div>
      <div style="margin-top:20px;display:flex;gap:16px;justify-content:center">
        <div class="stat-card" style="padding:10px 20px"><div class="stat-label">今日完成</div><div class="stat-num" id="pomo-count">0</div></div>
        <div class="stat-card" style="padding:10px 20px"><div class="stat-label">累計分鐘</div><div class="stat-num" id="pomo-mins">0</div></div>
      </div>
      <div style="margin-top:16px;text-align:left"><label class="form-label">目前任務</label><input type="text" id="pomo-task" placeholder="輸入正在進行的任務..."></div>
    </div>
  </div>
</div>
</div>

<script>
window.onerror=function(msg,src,line){var d=document.getElementById('global-err');if(d){d.style.display='block';d.textContent='錯誤(行'+line+'): '+msg;}return false;};
window.onunhandledrejection=function(e){var d=document.getElementById('global-err');if(d){d.style.display='block';d.textContent='錯誤: '+(e.reason||e);}};

const SB='https://mnaplphslldwaznbinwx.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uYXBscGhzbGxkd2F6bmJpbnd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzk2MDMsImV4cCI6MjA5MzcxNTYwM30.qYmRCUjXLIGKCbHi7ll00PuKxZWg2Cc65EbcJr9J9JI';
const SBH=function(){return{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'Prefer':'return=representation'};};
async function sbGet(t,q){var r=await fetch(SB+'/rest/v1/'+t+'?'+(q||''),{headers:SBH()});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbPost(t,d){var r=await fetch(SB+'/rest/v1/'+t,{method:'POST',headers:SBH(),body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbPatch(t,id,d){var r=await fetch(SB+'/rest/v1/'+t+'?id=eq.'+id,{method:'PATCH',headers:SBH(),body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbDel(t,id){var r=await fetch(SB+'/rest/v1/'+t+'?id=eq.'+id,{method:'DELETE',headers:SBH()});if(!r.ok)throw new Error(await r.text());}

var todos=[],goals=[],calDate=new Date(),todoFilter='all',editTodoId=null,editGoalId=null;
var wsKey='',currentUser='',subEditing=false,goalExpanded={};
var pomoMode='work',pomoSec=1500,pomoRunning=false,pomoTimer=null,pomoDone=0,pomoTotal=0;
var MEMBERS=['Alex','Brian','Cathy','Daniel'];
var POMO={work:{sec:1500,label:'專注時間'},short:{sec:300,label:'短暫休息'},long:{sec:900,label:'長時休息'}};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function p2(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mkSub(t){return {id:uid(),text:t,done:false,expanded:false,children:[]};}
function normSubs(a){return (Array.isArray(a)?a:[]).map(function(s){return Object.assign({children:[]},s,{children:normSubs(s.children)});});}
function $(id){return document.getElementById(id);}

function getNode(subs,path){var a=subs,n=null;for(var i=0;i<path.length;i++){n=a[path[i]];if(i<path.length-1)a=(n&&n.children)||[];}return n;}
function getParent(subs,path){if(path.length===1)return{arr:subs,idx:path[0]};var p=getNode(subs,path.slice(0,-1));if(!p.children)p.children=[];return{arr:p.children,idx:path[path.length-1]};}
function countAll(subs){var t=0,d=0;function w(a){(a||[]).forEach(function(s){t++;if(s.done)d++;w(s.children);});}w(subs);return{t:t,d:d};}
function buildSubPath(arr,path){var n=arr[path[0]];if(!n)return'';if(path.length===1)return n.text;return n.text+' / '+buildSubPath(n.children||[],path.slice(1));}
function collectUndone(arr,prefix,gname,date,out){(arr||[]).forEach(function(s){var fp=prefix?prefix+' / '+s.text:s.text;if(!s.done)out.push({text:gname+' / '+fp,date:date});collectUndone(s.children,fp,gname,date,out);});}

// ── 備份 ─────────────────────────────────────────────────
function autoBackup(){try{localStorage.setItem('vetica-backup',JSON.stringify({ts:Date.now(),todos:todos,goals:goals}));}catch(e){}}
function getBackup(){try{var r=localStorage.getItem('vetica-backup');return r?JSON.parse(r):null;}catch(e){return null;}}
function fmtTs(ts){if(!ts)return'';var d=new Date(ts);return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());}

function toggleBackupPanel(){
  var p=$('backup-panel');
  if(p.style.display==='block'){p.style.display='none';return;}
  $('bk-goals').textContent=goals.length;
  $('bk-todos').textContent=todos.length;
  var bk=getBackup();
  $('bk-local-time').textContent=bk?'本機快取：'+fmtTs(bk.ts):'尚無本機快取';
  $('import-status').style.display='none';
  p.style.display='block';
}

function exportJSON(){
  var data={exported_at:new Date().toISOString(),workspace:wsKey,goals:goals,todos:todos};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var ts=new Date();
  a.href=url;a.download='vetica-backup-'+ts.getFullYear()+p2(ts.getMonth()+1)+p2(ts.getDate())+'-'+p2(ts.getHours())+p2(ts.getMinutes())+'.json';
  a.click();URL.revokeObjectURL(url);
}

async function importJSON(){
  var file=$('import-file').files[0];
  var status=$('import-status');
  if(!file){status.style.display='block';status.style.background='#fff5f5';status.style.color='#993C1D';status.textContent='請先選擇 JSON 檔案';return;}
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.goals&&!data.todos)throw new Error('無效的備份格式');
      if(!confirm('確定匯入？\n匯出時間：'+(data.exported_at||'不明')+'\n目標：'+(data.goals||[]).length+' 個\n待辦：'+(data.todos||[]).length+' 筆'))return;
      setSyncStatus('syncing');
      var gOk=0,tOk=0;
      for(var i=0;i<(data.goals||[]).length;i++){var g=data.goals[i];try{await sbPatch('goals',g.id,{name:g.name,date:g.date,subs:g.subs,workspace:g.workspace||wsKey});gOk++;}catch(e1){try{await sbPost('goals',[Object.assign({},g,{workspace:g.workspace||wsKey})]);gOk++;}catch(e2){}}}
      for(var j=0;j<(data.todos||[]).length;j++){var t=data.todos[j];try{await sbPatch('todos',t.id,{text:t.text,done:t.done,priority:t.priority,member:t.member,date:t.date,note:t.note});tOk++;}catch(e1){try{await sbPost('todos',[Object.assign({},t,{workspace:t.workspace||wsKey})]);tOk++;}catch(e2){}}}
      setSyncStatus('ok');
      status.style.display='block';status.style.background='#EAF3DE';status.style.color='#3B6D11';
      status.textContent='✓ 匯入成功！目標 '+gOk+' 個、待辦 '+tOk+' 筆';
      await loadAll();
    }catch(err){status.style.display='block';status.style.background='#fff5f5';status.style.color='#993C1D';status.textContent='✗ 失敗：'+err.message;}
  };
  reader.readAsText(file);
}

async function restoreFromBackup(){
  var bk=getBackup();
  if(!bk){alert('找不到本機快取');return;}
  if(!confirm('從本機快取還原？\n時間：'+fmtTs(bk.ts)))return;
  setSyncStatus('syncing');
  try{
    for(var i=0;i<(bk.goals||[]).length;i++){var g=bk.goals[i];try{await sbPatch('goals',g.id,{name:g.name,date:g.date,subs:g.subs});}catch(e){try{await sbPost('goals',[g]);}catch(e2){}}}
    for(var j=0;j<(bk.todos||[]).length;j++){var t=bk.todos[j];try{await sbPatch('todos',t.id,{text:t.text,done:t.done,priority:t.priority,member:t.member,date:t.date,note:t.note});}catch(e){try{await sbPost('todos',[t]);}catch(e2){}}}
    setSyncStatus('ok');alert('還原成功');await loadAll();
  }catch(e){setSyncStatus('err');alert('還原失敗：'+e.message);}
}

// ── 拖拉排序 ──────────────────────────────────────────────
var dragSrcIdx=null;

function onDragStart(e){
  dragSrcIdx=parseInt(e.currentTarget.dataset.idx);
  e.currentTarget.style.opacity='0.4';
  e.dataTransfer.effectAllowed='move';
}
function onDragEnd(e){
  e.currentTarget.style.opacity='1';
  document.querySelectorAll('.todo-item').forEach(function(el){
    el.classList.remove('drag-over');
  });
}
function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  var item=e.currentTarget;
  item.classList.add('drag-over');
  return false;
}
function onDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
async function onDrop(e){
  e.stopPropagation();
  var targetIdx=parseInt(e.currentTarget.dataset.idx);
  e.currentTarget.classList.remove('drag-over');
  if(dragSrcIdx===null||dragSrcIdx===targetIdx)return;

  // 取得目前顯示的 list（全部模式才能拖拉）
  var item=todos.splice(dragSrcIdx,1)[0];
  todos.splice(targetIdx,0,item);
  dragSrcIdx=null;
  renderTodos();

  // 更新 sort_order 到 Supabase
  setSyncStatus('syncing');
  try{
    await Promise.all(todos.map(function(t,i){
      return sbPatch('todos',t.id,{sort_order:i});
    }));
    setSyncStatus('ok');autoBackup();
  }catch(e){setSyncStatus('err');}
  return false;
}
function setSyncStatus(s){
  var dot=$('sync-dot'),lbl=$('sync-lbl');
  if(s==='ok'){dot.className='sync-dot ok';lbl.textContent='已同步';}
  else if(s==='syncing'){dot.className='sync-dot syncing';lbl.textContent='同步中...';}
  else{dot.className='sync-dot err';lbl.textContent='連線失敗';}
}

async function moveDoneToBottom(){
  var undone=todos.filter(function(t){return !t.done;});
  var done=todos.filter(function(t){return t.done;});
  if(!done.length){return;}
  todos=undone.concat(done);
  renderTodos();
  setSyncStatus('syncing');
  try{
    await Promise.all(todos.map(function(t,i){
      return sbPatch('todos',t.id,{sort_order:i});
    }));
    setSyncStatus('ok');autoBackup();
    var btn=$('sort-done-btn');
    if(btn){btn.textContent='✓ 已整理';btn.style.background='#639922';btn.style.color='#fff';
      setTimeout(function(){btn.innerHTML='<i class="ti ti-arrow-down" style="font-size:11px"></i> 整理';btn.style.background='transparent';btn.style.color='#639922';},2000);}
  }catch(e){setSyncStatus('err');}
}

async function loadAll(){
  setSyncStatus('syncing');
  try{
    var res=await Promise.all([
      sbGet('todos','workspace=eq.'+encodeURIComponent(wsKey)+'&order=sort_order.asc,created_at.desc'),
      sbGet('goals','workspace=eq.'+encodeURIComponent(wsKey)+'&order=created_at.desc')
    ]);
    todos=res[0]||[];goals=res[1]||[];
    setSyncStatus('ok');
    var ce=$('conn-err');if(ce)ce.style.display='none';
    autoBackup();
  }catch(e){
    setSyncStatus('err');
    var ce=$('conn-err');if(ce){ce.style.display='block';ce.textContent='⚠️ 連線失敗：'+e.message;}
  }
  renderTodos();
  if(!subEditing)renderGoals();
  renderCal();
}

async function saveGoalSubs(gid){
  var g=goals.find(function(x){return x.id===gid;});if(!g)return;
  try{await sbPatch('goals',gid,{subs:g.subs});setSyncStatus('ok');autoBackup();}
  catch(e){setSyncStatus('err');}
}

async function addSubAsTodo(text,date){
  var data={id:uid(),workspace:wsKey,done:false,created_by:currentUser,text:text,priority:'',member:currentUser,date:date||null,note:''};
  try{var rec=await sbPost('todos',[data]);if(rec&&rec[0]){todos.unshift(rec[0]);setSyncStatus('ok');renderTodos();renderCal();return true;}return false;}
  catch(e){setSyncStatus('err');return false;}
}

function openTodoForm(id){
  editTodoId=id;
  $('todo-form-title').textContent=id?'編輯任務':'新增任務';
  var allM=[currentUser].concat(MEMBERS.filter(function(m){return m!==currentUser;}));
  $('f-member').innerHTML=allM.map(function(m){return '<option value="'+m+'">'+m+'</option>';}).join('');
  if(id){var t=todos.find(function(x){return x.id===id;})||{};$('f-text').value=t.text||'';$('f-pri').value=t.priority||'';$('f-member').value=t.member||currentUser;$('f-date').value=t.date||'';$('f-note').value=t.note||'';}
  else{$('f-text').value='';$('f-pri').value='';$('f-member').value=currentUser;$('f-date').value='';$('f-note').value='';}
  $('todo-form').style.display='block';$('f-text').focus();
}
$('todo-add-btn').addEventListener('click',function(){openTodoForm(null);});
$('todo-cancel-btn').addEventListener('click',function(){$('todo-form').style.display='none';editTodoId=null;});
$('todo-save-btn').addEventListener('click',async function(){
  var text=$('f-text').value.trim();if(!text)return;
  var data={text:text,priority:$('f-pri').value,member:$('f-member').value,date:$('f-date').value||null,note:$('f-note').value};
  setSyncStatus('syncing');
  try{
    if(editTodoId){await sbPatch('todos',editTodoId,data);var t=todos.find(function(x){return x.id===editTodoId;});if(t)Object.assign(t,data);}
    else{var rec=await sbPost('todos',[Object.assign({id:uid(),workspace:wsKey,done:false,created_by:currentUser},data)]);if(rec&&rec[0])todos.unshift(rec[0]);}
    setSyncStatus('ok');
  }catch(e){setSyncStatus('err');}
  $('todo-form').style.display='none';editTodoId=null;renderTodos();renderCal();
});

function renderTodos(){
  var list=todos;
  if(todoFilter==='active')list=todos.filter(function(t){return !t.done;});
  else if(todoFilter==='done')list=todos.filter(function(t){return t.done;});
  else if(todoFilter==='high')list=todos.filter(function(t){return t.priority==='high';});
  else if(todoFilter==='mid')list=todos.filter(function(t){return t.priority==='mid';});
  else if(todoFilter==='low')list=todos.filter(function(t){return t.priority==='low';});
  var el=$('todo-list');if(!el)return;
  var isDraggable=(todoFilter==='all');
  if(!list.length){el.innerHTML='<div class="empty"><i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:8px"></i>沒有符合的任務</div>';updateStats();return;}
  var html='';
  list.forEach(function(t,i){
    var pl=t.priority==='high'?'高優先':t.priority==='mid'?'中優先':t.priority==='low'?'低優先':'';
    html+='<div class="todo-item" '+(isDraggable?'draggable="true" data-idx="'+i+'"':'')+' style="'+(isDraggable?'cursor:default':'')+'">';
    if(isDraggable){html+='<div class="drag-handle"><i class="ti ti-grip-vertical" style="font-size:18px"></i></div>';}
    html+='<div class="todo-check'+(t.done?' done':'')+'" data-toggle-todo="'+t.id+'">'+(t.done?'<i class="ti ti-check" style="font-size:13px"></i>':'')+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div class="todo-text'+(t.done?' done':'')+'" style="margin-bottom:4px">'+esc(t.text)+'</div>'
      +'<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">'
      +(pl?'<span class="badge badge-'+t.priority+'">'+pl+'</span>':'')
      +(t.member?'<span class="badge badge-member"><i class="ti ti-user" style="font-size:10px"></i> '+esc(t.member)+'</span>':'')
      +(t.date?'<span class="badge badge-member"><i class="ti ti-calendar" style="font-size:10px"></i> '+t.date+'</span>':'')
      +(t.created_by?'<span style="font-size:11px;color:#aaa">by '+esc(t.created_by)+'</span>':'')
      +'</div></div>'
      +'<div style="display:flex;gap:4px;flex-shrink:0">'
      +'<button class="btn btn-sm" data-edit-todo="'+t.id+'"><i class="ti ti-edit" style="font-size:13px"></i> 編輯</button>'
      +'<button class="btn btn-sm btn-danger" data-del-todo="'+t.id+'" data-confirm="0"><i class="ti ti-trash" style="font-size:13px"></i></button>'
      +'</div></div>';
  });
  el.innerHTML=html;

  if(isDraggable){
    document.querySelectorAll('#todo-list .todo-item').forEach(function(item){
      item.addEventListener('dragstart',onDragStart);
      item.addEventListener('dragend',onDragEnd);
      item.addEventListener('dragover',onDragOver);
      item.addEventListener('dragleave',onDragLeave);
      item.addEventListener('drop',onDrop);
    });
  }
  updateStats();
}

function updateStats(){
  var active=todos.filter(function(t){return !t.done;}).length;
  var done=todos.filter(function(t){return t.done;}).length;
  var td=todos.filter(function(t){return t.date===todayStr()&&!t.done;}).length;
  $('s-active').textContent=active;$('h-todo').textContent=active;$('s-done').textContent=done;$('h-today').textContent=td;
}

$('todo-list').addEventListener('click',async function(e){
  var tog=e.target.closest('[data-toggle-todo]');
  if(tog){var id=tog.dataset.toggleTodo;var t=todos.find(function(x){return x.id===id;});if(!t)return;t.done=!t.done;renderTodos();try{await sbPatch('todos',id,{done:t.done});setSyncStatus('ok');}catch(err){t.done=!t.done;renderTodos();setSyncStatus('err');}return;}
  var ed=e.target.closest('[data-edit-todo]');if(ed){openTodoForm(ed.dataset.editTodo);return;}
  var dl=e.target.closest('[data-del-todo]');
  if(dl){
    if(dl.dataset.confirm==='1'){var id=dl.dataset.delTodo;todos=todos.filter(function(x){return x.id!==id;});renderTodos();renderCal();try{await sbDel('todos',id);setSyncStatus('ok');}catch(err){setSyncStatus('err');loadAll();}}
    else{dl.dataset.confirm='1';dl.innerHTML='<i class="ti ti-alert-triangle" style="font-size:13px"></i> 確認？';setTimeout(function(){if(dl){dl.dataset.confirm='0';dl.innerHTML='<i class="ti ti-trash" style="font-size:13px"></i>';}},2500);}
  }
});

// ── Goals ─────────────────────────────────────────────────
function renderSubTree(subs,gid,path,level){
  if(!subs||!subs.length)return'';
  var html='';
  subs.forEach(function(s,i){
    var p=path.concat([i]);
    var ps=p.join('-');
    var hasKids=s.children&&s.children.length>0;
    var canAdd=level<2;
    var addFormId='acf_'+gid+'_'+ps.replace(/-/g,'_');
    var editFormId='edf_'+gid+'_'+ps.replace(/-/g,'_');

    html+='<div>';
    html+='<div class="sub-row" style="padding-left:'+(level*22)+'px">';
    // 展開按鈕
    html+='<div style="width:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center">';
    if(hasKids)html+='<button style="border:none;background:none;cursor:pointer;padding:0;color:#aaa;display:flex;align-items:center" data-exp="'+gid+'" data-path="'+ps+'"><i class="ti ti-chevron-'+(s.expanded?'down':'right')+'" style="font-size:11px"></i></button>';
    html+='</div>';
    // 勾選
    html+='<div class="sub-check'+(s.done?' done':'')+'" style="width:17px;height:17px;flex-shrink:0" data-sub-toggle="'+gid+'" data-path="'+ps+'">'+(s.done?'<i class="ti ti-check" style="font-size:10px"></i>':'')+'</div>';
    // 文字
    html+='<span style="flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'+(s.done?'text-decoration:line-through;color:#aaa':'')+'">'+ esc(s.text)+'</span>';
    // ＋待辦
    html+='<button class="sub-btn" style="background:#f0f9ea;color:#639922;border-color:#639922;border-width:2px;font-weight:500" data-add-todo="'+gid+'" data-path="'+ps+'">＋ 待辦</button>';
    // ✏ 編輯
    html+='<button class="sub-btn" style="background:#f0f0ff;color:#555;border-color:#aaa" data-edit-sub="'+gid+'" data-path="'+ps+'"><i class="ti ti-edit" style="font-size:11px"></i></button>';
    // ＋子任務
    if(canAdd)html+='<button class="sub-btn" style="background:#f5f5f3;color:#555;border-color:#ccc" data-add-child="'+gid+'" data-path="'+ps+'"><i class="ti ti-plus" style="font-size:11px"></i></button>';
    // ✕ 刪除
    html+='<button class="sub-btn" style="background:transparent;color:#E24B4A;border-color:#E24B4A" data-del-sub="'+gid+'" data-path="'+ps+'"><i class="ti ti-x" style="font-size:11px"></i></button>';
    html+='</div>';

    // 新增子任務表單
    html+='<div class="sub-form" id="'+addFormId+'" style="margin-left:'+(level*22+20)+'px">';
    html+='<div style="display:flex;gap:6px;align-items:center">';
    html+='<input class="kid-input" type="text" placeholder="輸入子任務名稱..." style="flex:1;padding:5px 8px;font-size:12px">';
    html+='<button class="btn btn-primary btn-sm confirm-kid" data-gid="'+gid+'" data-path="'+ps+'">新增</button>';
    html+='<button class="btn btn-sm cancel-kid" data-gid="'+gid+'" data-path="'+ps+'">取消</button>';
    html+='</div></div>';

    // 編輯子任務表單
    html+='<div class="sub-form" id="'+editFormId+'" style="margin-left:'+(level*22+20)+'px">';
    html+='<div style="display:flex;gap:6px;align-items:center">';
    html+='<input class="edit-sub-input" type="text" value="'+esc(s.text)+'" style="flex:1;padding:5px 8px;font-size:12px">';
    html+='<button class="btn btn-primary btn-sm confirm-edit-sub" data-gid="'+gid+'" data-path="'+ps+'">儲存</button>';
    html+='<button class="btn btn-sm cancel-edit-sub" data-gid="'+gid+'" data-path="'+ps+'">取消</button>';
    html+='</div></div>';

    if(hasKids&&s.expanded)html+='<div>'+renderSubTree(s.children,gid,p,level+1)+'</div>';
    html+='</div>';
  });
  return html;
}

function renderGoals(){
  if(subEditing)return;
  var el=$('goal-list');if(!el)return;
  if(!goals.length){el.innerHTML='<div class="empty"><i class="ti ti-target" style="font-size:32px;display:block;margin-bottom:8px"></i>尚無目標</div>';return;}
  var html='';
  goals.forEach(function(g){
    var subs=normSubs(g.subs);
    var res=countAll(subs);
    var pct=res.t?Math.round(res.d/res.t*100):0;
    var open=goalExpanded[g.id]!==false;
    html+='<div class="goal-item">';
    html+='<div class="row-between" style="margin-bottom:8px">';
    html+='<div style="display:flex;align-items:center;gap:8px;cursor:pointer" data-toggle-goal="'+g.id+'">';
    html+='<i class="ti ti-chevron-'+(open?'down':'right')+'" style="font-size:13px;color:#aaa"></i>';
    html+='<span style="font-weight:500;font-size:15px">'+esc(g.name)+'</span>';
    html+='</div>';
    html+='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">';
    if(g.created_by)html+='<span style="font-size:11px;color:#aaa">by '+esc(g.created_by)+'</span>';
    if(g.date)html+='<span style="font-size:12px;color:#888">'+g.date+'</span>';
    html+='<span style="font-size:13px;font-weight:600;color:#555">'+pct+'%</span>';
    html+='<button class="sub-btn" style="background:transparent;color:#639922;border-color:#639922;padding:3px 10px;font-size:12px" data-batch-add="'+g.id+'">批次加入待辦</button>';
    html+='<button class="btn btn-sm" data-edit-goal="'+g.id+'"><i class="ti ti-edit" style="font-size:12px"></i> 編輯</button>';
    html+='<button class="btn btn-sm btn-danger" data-del-goal="'+g.id+'" data-confirm="0"><i class="ti ti-trash" style="font-size:12px"></i></button>';
    html+='</div></div>';
    html+='<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
    if(open)html+='<div>'+renderSubTree(subs,g.id,[],0)+'</div>';
    else html+='<div style="font-size:12px;color:#aaa;padding:4px 0">'+subs.length+' 項子任務（點標題展開）</div>';
    html+='</div>';
  });
  el.innerHTML=html;
}

function closeAllSubForms(){document.querySelectorAll('.sub-form').forEach(function(f){f.style.display='none';});}

$('goal-list').addEventListener('click',async function(e){
  // ＋待辦
  var addTodo=e.target.closest('[data-add-todo]');
  if(addTodo){
    var gid=addTodo.dataset.addTodo,ps=addTodo.dataset.path,path=ps.split('-').map(Number);
    var g=goals.find(function(x){return x.id===gid;});if(!g)return;
    var subs=normSubs(g.subs);
    var text=g.name+' / '+buildSubPath(subs,path);
    addTodo.textContent='⏳...';addTodo.disabled=true;
    var ok=await addSubAsTodo(text,g.date||null);
    addTodo.textContent=ok?'✓ 已加入':'✗ 失敗';
    addTodo.style.background=ok?'#639922':'#E24B4A';addTodo.style.color='#fff';addTodo.disabled=false;
    setTimeout(function(){addTodo.textContent='＋ 待辦';addTodo.style.background='#f0f9ea';addTodo.style.color='#639922';},2000);
    return;
  }
  // 批次加入待辦
  var batchAdd=e.target.closest('[data-batch-add]');
  if(batchAdd){
    var gid=batchAdd.dataset.batchAdd;
    var g=goals.find(function(x){return x.id===gid;});if(!g)return;
    var items=[];collectUndone(normSubs(g.subs),'',g.name,g.date||null,items);
    if(!items.length){batchAdd.textContent='無未完成項目';setTimeout(function(){batchAdd.textContent='批次加入待辦';},2000);return;}
    batchAdd.textContent='⏳ 新增中...';batchAdd.disabled=true;
    var results=await Promise.all(items.map(function(item){return addSubAsTodo(item.text,item.date);}));
    var count=results.filter(Boolean).length;
    batchAdd.textContent='✓ 已加入 '+count+' 項';batchAdd.style.background='#639922';batchAdd.style.color='#fff';batchAdd.disabled=false;
    setTimeout(function(){batchAdd.textContent='批次加入待辦';batchAdd.style.background='transparent';batchAdd.style.color='#639922';},2500);
    return;
  }
  // 展開目標
  var togGoal=e.target.closest('[data-toggle-goal]');
  if(togGoal){goalExpanded[togGoal.dataset.toggleGoal]=goalExpanded[togGoal.dataset.toggleGoal]===false?true:false;renderGoals();return;}
  // 編輯目標
  var edGoal=e.target.closest('[data-edit-goal]');if(edGoal){openGoalForm(edGoal.dataset.editGoal);return;}
  // 刪除目標
  var dlGoal=e.target.closest('[data-del-goal]');
  if(dlGoal){
    if(dlGoal.dataset.confirm==='1'){var id=dlGoal.dataset.delGoal;goals=goals.filter(function(x){return x.id!==id;});renderGoals();try{await sbDel('goals',id);setSyncStatus('ok');}catch(err){setSyncStatus('err');loadAll();}}
    else{dlGoal.dataset.confirm='1';dlGoal.innerHTML='<i class="ti ti-alert-triangle"></i> 確認？';setTimeout(function(){if(dlGoal){dlGoal.dataset.confirm='0';dlGoal.innerHTML='<i class="ti ti-trash" style="font-size:12px"></i>';}},2500);}
    return;
  }
  // 展開/收合子任務
  var expBtn=e.target.closest('[data-exp]');
  if(expBtn){
    var gid=expBtn.dataset.exp,path=expBtn.dataset.path.split('-').map(Number);
    var g=goals.find(function(x){return x.id===gid;});if(!g)return;
    g.subs=normSubs(g.subs);var node=getNode(g.subs,path);if(!node)return;
    node.expanded=!node.expanded;saveGoalSubs(gid);renderGoals();return;
  }
  // 勾選子任務
  var togSub=e.target.closest('[data-sub-toggle]');
  if(togSub){
    var gid=togSub.dataset.subToggle,path=togSub.dataset.path.split('-').map(Number);
    var g=goals.find(function(x){return x.id===gid;});if(!g)return;
    g.subs=normSubs(g.subs);var node=getNode(g.subs,path);if(!node)return;
    node.done=!node.done;saveGoalSubs(gid);renderGoals();return;
  }
  // ✏ 編輯子任務 → 開啟編輯表單
  var editSub=e.target.closest('[data-edit-sub]');
  if(editSub){
    var gid=editSub.dataset.editSub,ps=editSub.dataset.path;
    var editFormId='edf_'+gid+'_'+ps.replace(/-/g,'_');
    closeAllSubForms();
    var form=document.getElementById(editFormId);if(!form)return;
    subEditing=true;form.style.display='block';
    var inp=form.querySelector('.edit-sub-input');if(inp){inp.focus();inp.select();}
    return;
  }
  // 確認編輯子任務
  var confEdit=e.target.closest('.confirm-edit-sub');
  if(confEdit){
    var gid=confEdit.dataset.gid,ps=confEdit.dataset.path,path=ps.split('-').map(Number);
    var editFormId='edf_'+gid+'_'+ps.replace(/-/g,'_');
    var form=document.getElementById(editFormId);if(!form)return;
    var newText=form.querySelector('.edit-sub-input').value.trim();if(!newText)return;
    var g=goals.find(function(x){return x.id===gid;});if(!g)return;
    g.subs=normSubs(g.subs);var node=getNode(g.subs,path);if(!node)return;
    node.text=newText; // 只改文字，children 完整保留
    subEditing=false;form.style.display='none';saveGoalSubs(gid);renderGoals();return;
  }
  // 取消編輯子任務
  var cancEdit=e.target.closest('.cancel-edit-sub');
  if(cancEdit){
    var gid=cancEdit.dataset.gid,ps=cancEdit.dataset.path;
    var editFormId='edf_'+gid+'_'+ps.replace(/-/g,'_');
    var form=document.getElementById(editFormId);if(form)form.style.display='none';
    subEditing=false;return;
  }
  // 刪除子任務
  var delSub=e.target.closest('[data-del-sub]');
  if(delSub){
    var gid=delSub.dataset.delSub,path=delSub.dataset.path.split('-').map(Number);
    var g=goals.find(function(x){return x.id===gid;});if(!g)return;
    g.subs=normSubs(g.subs);var par=getParent(g.subs,path);par.arr.splice(par.idx,1);
    saveGoalSubs(gid);renderGoals();return;
  }
  // 新增子任務按鈕
  var addChild=e.target.closest('[data-add-child]');
  if(addChild){
    var gid=addChild.dataset.addChild,ps=addChild.dataset.path;
    var addFormId='acf_'+gid+'_'+ps.replace(/-/g,'_');
    closeAllSubForms();
    var form=document.getElementById(addFormId);if(!form)return;
    subEditing=true;form.style.display='block';form.querySelector('.kid-input').focus();return;
  }
  // 確認新增子任務
  var confKid=e.target.closest('.confirm-kid');
  if(confKid){
    var gid=confKid.dataset.gid,ps=confKid.dataset.path,path=ps.split('-').map(Number);
    var addFormId='acf_'+gid+'_'+ps.replace(/-/g,'_');
    var form=document.getElementById(addFormId);if(!form)return;
    var text=form.querySelector('.kid-input').value.trim();if(!text)return;
    var g=goals.find(function(x){return x.id===gid;});if(!g)return;
    g.subs=normSubs(g.subs);var node=getNode(g.subs,path);if(!node)return;
    node.children.push(mkSub(text));node.expanded=true;
    subEditing=false;saveGoalSubs(gid);renderGoals();return;
  }
  // 取消新增子任務
  var cancKid=e.target.closest('.cancel-kid');
  if(cancKid){
    var gid=cancKid.dataset.gid,ps=cancKid.dataset.path;
    var addFormId='acf_'+gid+'_'+ps.replace(/-/g,'_');
    var form=document.getElementById(addFormId);if(form)form.style.display='none';
    subEditing=false;return;
  }
  // 點擊表單外部關閉
  if(subEditing&&!e.target.closest('.sub-form')&&!e.target.closest('[data-add-child]')&&!e.target.closest('[data-edit-sub]')){
    closeAllSubForms();subEditing=false;renderGoals();
  }
});

document.addEventListener('keydown',function(e){
  if(e.target.classList.contains('kid-input')){
    var form=e.target.closest('.sub-form');if(!form)return;
    if(e.key==='Enter'){var btn=form.querySelector('.confirm-kid');if(btn)btn.click();}
    if(e.key==='Escape'){var btn=form.querySelector('.cancel-kid');if(btn)btn.click();}
  }
  if(e.target.classList.contains('edit-sub-input')){
    var form=e.target.closest('.sub-form');if(!form)return;
    if(e.key==='Enter'){var btn=form.querySelector('.confirm-edit-sub');if(btn)btn.click();}
    if(e.key==='Escape'){var btn=form.querySelector('.cancel-edit-sub');if(btn)btn.click();}
  }
});

$('goal-add-btn').addEventListener('click',function(){openGoalForm(null);});
$('goal-cancel-btn').addEventListener('click',function(){$('goal-form').style.display='none';editGoalId=null;});
$('goal-save-btn').addEventListener('click',async function(){
  var name=$('f-gname').value.trim();if(!name)return;
  var lines=$('f-gsub').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  setSyncStatus('syncing');
  try{
    if(editGoalId){
      var g=goals.find(function(x){return x.id===editGoalId;});
      var ex=normSubs(g?g.subs:[]);
      var merged=lines.map(function(txt,idx){
        var byText=ex.find(function(o){return o.text===txt;});if(byText)return byText;
        if(ex[idx])return Object.assign({},ex[idx],{text:txt});
        return mkSub(txt);
      });
      await sbPatch('goals',editGoalId,{name:name,date:$('f-gdate').value||null,subs:merged});
      if(g){g.name=name;g.date=$('f-gdate').value;g.subs=merged;}
    }else{
      var rec=await sbPost('goals',[{id:uid(),workspace:wsKey,name:name,date:$('f-gdate').value||null,created_by:currentUser,subs:lines.map(mkSub)}]);
      if(rec&&rec[0])goals.unshift(rec[0]);
    }
    setSyncStatus('ok');autoBackup();
  }catch(e){setSyncStatus('err');}
  $('goal-form').style.display='none';editGoalId=null;renderGoals();
});

function openGoalForm(id){
  editGoalId=id;$('goal-form-title').textContent=id?'編輯目標':'新增目標';
  if(id){var g=goals.find(function(x){return x.id===id;})||{};$('f-gname').value=g.name||'';$('f-gdate').value=g.date||'';$('f-gsub').value=normSubs(g.subs).map(function(s){return s.text;}).join('\n');}
  else{$('f-gname').value='';$('f-gdate').value='';$('f-gsub').value='';}
  $('goal-form').style.display='block';$('f-gname').focus();
}

// ── Calendar ──────────────────────────────────────────────
function renderCal(){
  var y=calDate.getFullYear(),m=calDate.getMonth();
  $('cal-title').textContent=y+' 年 '+(m+1)+' 月';
  $('cal-names').innerHTML=['日','一','二','三','四','五','六'].map(function(n){return '<div class="cal-day-name">'+n+'</div>';}).join('');
  var first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),ts=todayStr();
  var html='';
  for(var i=0;i<first;i++){var d=new Date(y,m,1-first+i);html+='<div class="cal-day other-month"><div class="cal-num">'+d.getDate()+'</div></div>';}
  for(var d=1;d<=days;d++){
    var ds=y+'-'+p2(m+1)+'-'+p2(d);
    var dt=todos.filter(function(t){return t.date===ds;});
    html+='<div class="cal-day'+(ds===ts?' today':'')+'" data-calday="'+ds+'">';
    html+='<div class="cal-num">'+d+'</div>';
    dt.slice(0,2).forEach(function(t){html+='<div class="cal-dot '+(t.priority||'')+'">'+esc(t.text)+'</div>';});
    if(dt.length>2)html+='<div class="cal-dot">+'+( dt.length-2)+'</div>';
    html+='</div>';
  }
  $('cal-days').innerHTML=html;
  var mc={};
  todos.filter(function(t){return t.date&&!t.done;}).forEach(function(t){var pts=t.date.split('-');if(pts.length<2)return;var k=pts[0]+'-'+pts[1];mc[k]=(mc[k]||0)+1;});
  var ck=y+'-'+p2(m+1);
  $('cal-summary').innerHTML=Object.entries(mc).sort(function(a,b){return a[0].localeCompare(b[0]);}).map(function(entry){
    var key=entry[0],count=entry[1],parts=key.split('-'),act=key===ck;
    return '<button data-cal-jump="'+key+'" style="padding:3px 10px;border-radius:100px;border:1px solid '+(act?'#555':'#ddd')+';background:'+(act?'#555':'transparent')+';color:'+(act?'#fff':'#888')+';cursor:pointer;font-size:12px;font-family:inherit">'+parseInt(parts[1])+'月 <strong>'+count+'</strong></button>';
  }).join('');
}
$('cal-prev').addEventListener('click',function(){calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCal();});
$('cal-next').addEventListener('click',function(){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCal();});
$('cal-today-btn').addEventListener('click',function(){calDate=new Date();renderCal();});
$('cal-days').addEventListener('click',function(e){var el=e.target.closest('[data-calday]');if(el)showCalDay(el.dataset.calday);});
$('cal-summary').addEventListener('click',function(e){var el=e.target.closest('[data-cal-jump]');if(el){var parts=el.dataset.calJump.split('-');calDate=new Date(parseInt(parts[0]),parseInt(parts[1])-1,1);renderCal();}});

function showCalDay(ds){
  var dt=todos.filter(function(t){return t.date===ds;});
  var det=$('cal-detail');
  if(!dt.length){det.style.display='none';return;}
  det.style.display='block';
  var html='<div class="row-between mb12"><div style="font-weight:500">'+ds+'（'+dt.length+' 項）</div><button class="btn btn-primary btn-sm" data-quick-add="'+ds+'"><i class="ti ti-plus"></i> 新增</button></div>';
  dt.forEach(function(t){html+='<div class="todo-item" style="padding:8px 0"><div class="todo-check'+(t.done?' done':'')+'" style="width:18px;height:18px" data-toggle-todo="'+t.id+'">'+(t.done?'<i class="ti ti-check" style="font-size:11px"></i>':'')+'</div><div class="todo-text'+(t.done?' done':'')+'" style="flex:1">'+esc(t.text)+'</div>'+(t.priority?'<span class="badge badge-'+t.priority+'">'+(t.priority==='high'?'高':t.priority==='mid'?'中':'低')+'</span>':'')+'</div>';});
  $('cal-detail-content').innerHTML=html;
}
$('cal-detail').addEventListener('click',async function(e){
  var tog=e.target.closest('[data-toggle-todo]');
  if(tog){var id=tog.dataset.toggleTodo;var t=todos.find(function(x){return x.id===id;});if(!t)return;t.done=!t.done;renderCal();try{await sbPatch('todos',id,{done:t.done});setSyncStatus('ok');}catch(err){t.done=!t.done;renderCal();setSyncStatus('err');}return;}
  var qa=e.target.closest('[data-quick-add]');
  if(qa){document.querySelector('[data-tab="todo"]').click();setTimeout(function(){openTodoForm(null);setTimeout(function(){$('f-date').value=qa.dataset.quickAdd;},50);},100);}
});

// ── Pomodoro ──────────────────────────────────────────────
function updatePomoDisplay(){
  $('pomo-display').textContent=p2(Math.floor(pomoSec/60))+':'+p2(pomoSec%60);
  var circ=2*Math.PI*70,pct=(POMO[pomoMode].sec-pomoSec)/POMO[pomoMode].sec;
  $('pomo-arc').setAttribute('stroke-dashoffset',circ*(1-pct));
  $('pomo-status').textContent=POMO[pomoMode].label;
}
$('pomo-toggle').addEventListener('click',function(){
  if(pomoRunning){clearInterval(pomoTimer);pomoRunning=false;$('pomo-toggle').innerHTML='<i class="ti ti-player-play"></i> 開始';}
  else{
    pomoRunning=true;$('pomo-toggle').innerHTML='<i class="ti ti-player-pause"></i> 暫停';
    pomoTimer=setInterval(function(){
      if(pomoSec<=0){clearInterval(pomoTimer);pomoRunning=false;if(pomoMode==='work'){pomoDone++;pomoTotal+=25;$('pomo-count').textContent=pomoDone;$('pomo-mins').textContent=pomoTotal;}$('pomo-toggle').innerHTML='<i class="ti ti-player-play"></i> 開始';pomoSec=0;updatePomoDisplay();return;}
      pomoSec--;updatePomoDisplay();},1000);
  }
});
$('pomo-reset').addEventListener('click',function(){clearInterval(pomoTimer);pomoRunning=false;pomoSec=POMO[pomoMode].sec;updatePomoDisplay();$('pomo-toggle').innerHTML='<i class="ti ti-player-play"></i> 開始';});
document.querySelectorAll('[data-pomo]').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('[data-pomo]').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');pomoMode=btn.dataset.pomo;clearInterval(pomoTimer);pomoRunning=false;pomoSec=POMO[pomoMode].sec;updatePomoDisplay();$('pomo-toggle').innerHTML='<i class="ti ti-player-play"></i> 開始';
  });
});

updatePomoDisplay();
</script>
